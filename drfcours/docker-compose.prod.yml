version: '3.8'

services:
  db:
    image: postgres:16.0-alpine
    env_file: .env.prod  # Отдельный файл для production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $POSTGRES_DB -U $POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 2G

  redis:
    image: redis:7-alpine
    env_file: .env.prod
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 1s
      retries: 5

  app:
    build:
      context: .
      args:
        ENV: prod
    image: your-registry/your-app:${TAG:-latest}
    env_file: .env.prod
    environment:
      PYTHONUNBUFFERED: "1"
      GUNICORN_CMD_ARGS: "--workers=4 --threads=2 --worker-class=gthread"
    command: >
      bash -c "python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application"
    networks:
      - backend
      - frontend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: your-registry/your-nginx:${TAG:-latest}
    build:
      context: ./nginx
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_volume:/usr/share/nginx/html/static:ro
      - media_volume:/usr/share/nginx/html/media:ro
      - ./nginx/ssl:/etc/nginx/ssl
    networks:
      - frontend
    depends_on:
      - app
    restart: unless-stopped

  celery-worker:
    image: your-registry/your-app:${TAG:-latest}
    env_file: .env.prod
    command: celery -A config worker -l INFO --concurrency=4
    networks:
      - backend
    deploy:
      replicas: 2
    restart: unless-stopped

  celery-beat:
    image: your-registry/your-app:${TAG:-latest}
    env_file: .env.prod
    command: celery -A config beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    networks:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge